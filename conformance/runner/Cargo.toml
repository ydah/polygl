[package]
name = "polygl-conformance"
description = "Three-layer conformance runner for PolyGL adapters"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
polygl-adapter-api = { path = "../../crates/polygl-adapter-api" }
polygl-backend-glsl = { path = "../../crates/polygl-backend-glsl" }
polygl-core = { path = "../../crates/polygl-core" }
polygl-hir = { path = "../../crates/polygl-hir" }
polygl-lir = { path = "../../crates/polygl-lir" }
polygl-span = { path = "../../crates/polygl-span" }
polygl-types = { path = "../../crates/polygl-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
insta = { version = "=1.48.0", default-features = false }
tempfile = "=3.27.0"

[lints]
workspace = true
