<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    >
    <title>
      {%- if page.title -%}{{ page.title | escape }} · {% endif -%}
      {{ site.title | escape }}
    </title>
    <link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script defer src="{{ '/assets/site.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="PolyGL documentation home">
          <img src="{{ '/assets/mark.svg' | relative_url }}" alt="" width="30" height="30">
          <span>PolyGL</span>
          <span class="brand-label">Docs</span>
        </a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a href="{{ '/getting-started/ruby/' | relative_url }}">Ruby</a>
          <a href="{{ '/getting-started/php/' | relative_url }}">PHP</a>
          <a href="{{ '/getting-started/perl/' | relative_url }}">Perl</a>
          <a href="{{ '/api/' | relative_url }}">API</a>
        </nav>
        <form class="site-search" role="search" action="{{ '/' | relative_url }}">
          <label class="sr-only" for="site-search-input">Search documentation topics</label>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/>
          </svg>
          <input
            id="site-search-input"
            name="q"
            type="search"
            placeholder="Search topics"
            autocomplete="off"
          >
        </form>
      </div>
    </header>
    <main id="main-content" class="content-shell">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div>
        <strong>PolyGL</strong>
        <span>Ruby · PHP · Perl → JavaScript · GLSL → WebGL 2</span>
      </div>
      <nav aria-label="Footer navigation">
        <a href="{{ '/cli/' | relative_url }}">CLI</a>
        <a href="{{ '/adapter-guide/' | relative_url }}">Adapters</a>
        <a href="{{ '/performance/' | relative_url }}">Performance</a>
        <a href="https://github.com/ydah/polygl">Source</a>
      </nav>
    </footer>
  </body>
</html>
