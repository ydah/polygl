[workspace]
members = ["crates/*", "conformance/runner", "xtask"]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ydah/polygl"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
