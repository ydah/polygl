[package]
name = "polygl-cli"
description = "Command-line interface for PolyGL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
polygl-adapter-api = { path = "../polygl-adapter-api" }
polygl-adapter-perl = { path = "../polygl-adapter-perl" }
polygl-adapter-php = { path = "../polygl-adapter-php" }
polygl-adapter-ruby = { path = "../polygl-adapter-ruby" }
polygl-backend-glsl = { path = "../polygl-backend-glsl" }
polygl-backend-js = { path = "../polygl-backend-js" }
polygl-core = { path = "../polygl-core" }
polygl-hir = { path = "../polygl-hir" }
polygl-lir = { path = "../polygl-lir" }
polygl-span = { path = "../polygl-span" }
polygl-types = { path = "../polygl-types" }
serde_json = "1.0.149"

[[bin]]
name = "polygl"
path = "src/main.rs"

[lints]
workspace = true
