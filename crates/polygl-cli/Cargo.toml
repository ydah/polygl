[package]
name = "polygl-cli"
description = "Command-line interface for PolyGL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "=1.8.7"
caseless = "=0.2.2"
polygl-adapter-api = { path = "../polygl-adapter-api", version = "=0.2.1" }
polygl-backend-glsl = { path = "../polygl-backend-glsl", version = "=0.2.1" }
polygl-backend-js = { path = "../polygl-backend-js", version = "=0.2.1" }
polygl-core = { path = "../polygl-core", version = "=0.2.1" }
polygl-hir = { path = "../polygl-hir", version = "=0.2.1" }
polygl-lir = { path = "../polygl-lir", version = "=0.2.1" }
polygl-span = { path = "../polygl-span", version = "=0.2.1" }
polygl-types = { path = "../polygl-types", version = "=0.2.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "=3.27.0"
toml = "=1.1.8"
unicode-normalization = "=0.1.25"

[[bin]]
name = "polygl"
path = "src/main.rs"

[lints]
workspace = true
