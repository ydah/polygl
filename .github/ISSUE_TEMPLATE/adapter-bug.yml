name: Language adapter bug
description: Report Ruby, PHP, or Perl syntax, span, annotation, or lowering behavior.
title: "[adapter] "
labels: [bug, adapter]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Ruby, PHP, Perl]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PolyGL version or commit
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Diagnostic code, spans, and observed lowering
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Common Core or adapter documentation that defines the expectation
    validations:
      required: true
  - type: textarea
    id: parser
    attributes:
      label: Upstream-language/parser comparison, if relevant
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The requested behavior is inside the documented Common Core.
          required: true
