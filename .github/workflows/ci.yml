name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust / fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust / clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust / test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

  toolchain:
    name: Rust / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSRV
            toolchain: 1.96.1
          - name: stable
            toolchain: stable
          - name: next
            toolchain: beta
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Check all targets and features
        run: >-
          cargo +${{ matrix.toolchain }} check
          --locked --workspace --all-targets --all-features

  rustdoc:
    name: Rust / rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build workspace documentation
        run: cargo doc --locked --workspace --all-features --no-deps

  runtime:
    name: Runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml

      - name: Install runtime dependencies
        run: pnpm --dir runtime install --frozen-lockfile

      - name: Type-check runtime
        run: pnpm --dir runtime check

      - name: Test runtime
        run: pnpm --dir runtime test

  npm-cli:
    name: npm CLI wrapper / ${{ matrix.channel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel:
          - minimum
          - development
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Node.js
        if: matrix.channel == 'minimum'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.0.0

      - name: Install development Node.js
        if: matrix.channel == 'development'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test platform resolution
        run: node --test npm/cli/test/*.test.mjs

  conformance:
    name: Conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Validate conformance layers
        run: cargo xtask conformance

  generated:
    name: Generated files
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check generated-file freshness
        run: cargo xtask gen-runtime --check

      - name: Install pinned license generator
        run: cargo install --locked --version 0.9.1 --features cli cargo-about

      - name: Check third-party license notices
        run: |
          generated="$(mktemp)"
          trap 'rm -f "$generated"' EXIT
          cargo about generate --locked \
            --manifest-path crates/polygl-cli/Cargo.toml \
            about.hbs \
            -o "$generated"
          perl -pi -e 's/\r\n\z/\n/; s/[ \t]+\n\z/\n/' "$generated"
          cmp THIRD_PARTY_LICENSES.txt "$generated"

  reproducible:
    name: Reproducible release build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare independent clean builds
        run: scripts/check-reproducible-build.sh
