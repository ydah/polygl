name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to validate and package without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      dist_tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Derive and validate release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "release publication requires a v-prefixed tag" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          node npm/scripts/validate-release.mjs "$version" .

      - name: Require a release tag from main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release tag must point to a commit reachable from origin/main" >&2
            exit 1
          fi

      - name: Validate crate publication order
        run: cargo xtask release-stages

  build:
    name: Build / ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64
            binary: polygl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64
            binary: polygl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: darwin-x64
            binary: polygl
          - runner: macos-14
            target: aarch64-apple-darwin
            package: darwin-arm64
            binary: polygl
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: win32-x64
            binary: polygl.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Add release target
        run: rustup target add ${{ matrix.target }}

      - name: Build native executable
        run: cargo build --locked --release --target ${{ matrix.target }} -p polygl-cli

      - name: Verify native executable version
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          actual="$("$binary" --version)"
          expected="polygl ${{ needs.validate.outputs.version }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "native version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Stage npm and release artifacts
        shell: bash
        run: |
          mkdir -p "bundle/${{ matrix.package }}" release/stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "bundle/${{ matrix.package }}/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "release/stage/${{ matrix.binary }}"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.txt release/stage/
          tar -C release/stage -czf \
            "release/polygl-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz" \
            "${{ matrix.binary }}" \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD_PARTY_LICENSES.txt

      - name: Upload native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            bundle
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  preflight:
    name: Verify release payloads
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.18.0

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Verify native bundles and legal-complete archives
        run: >-
          node npm/scripts/verify-release-artifacts.mjs
          "${{ needs.validate.outputs.version }}"
          artifacts
          .

      - name: Generate archive checksums
        shell: bash
        run: |
          cd artifacts/release
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Build the complete Cargo workspace
        run: cargo build --locked --workspace

      - name: Test the complete Cargo workspace
        run: cargo test --locked --workspace

      - name: Assemble and inspect Cargo packages
        run: >-
          bash scripts/release-crates.sh package
          preflight/cargo-packages
          "${{ needs.validate.outputs.version }}"

      - name: Prepare npm packages
        run: >-
          node npm/scripts/prepare-release.mjs
          "${{ needs.validate.outputs.version }}"
          artifacts

      - name: Test prepared npm packages
        run: npm test --prefix npm/cli

      - name: Inspect and pack npm payloads
        shell: bash
        run: |
          mkdir -p preflight/npm-dry-run preflight/npm-packages
          packages=(
            ./npm/platforms/darwin-arm64:polygl-cli-darwin-arm64
            ./npm/platforms/darwin-x64:polygl-cli-darwin-x64
            ./npm/platforms/linux-arm64:polygl-cli-linux-arm64
            ./npm/platforms/linux-x64:polygl-cli-linux-x64
            ./npm/platforms/win32-x64:polygl-cli-win32-x64
            ./npm/cli:polygl-cli
          )
          for entry in "${packages[@]}"; do
            package="${entry%%:*}"
            archive="${entry#*:}"
            npm pack "$package" --ignore-scripts --dry-run --json \
              > "preflight/npm-dry-run/${archive}.json"
            packed="$(npm pack "$package" --ignore-scripts \
              --pack-destination preflight/npm-packages
            )"
            mv "preflight/npm-packages/$packed" \
              "preflight/npm-packages/${archive}.tgz"
          done

      - name: Verify packed npm payloads
        run: >-
          node npm/scripts/verify-packed-release.mjs
          "${{ needs.validate.outputs.version }}"
          npm
          preflight/npm-packages

      - name: Retain verified release payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight
          path: |
            .node-version
            artifacts/release
            preflight
            scripts/release-npm.sh
          if-no-files-found: error
          retention-days: 14

  crates-publish:
    name: Publish crates.io packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish dependency stages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          bash scripts/release-crates.sh publish
          "${{ needs.validate.outputs.version }}"

  npm-publish:
    name: Publish npm packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight
          path: release-preflight

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: release-preflight/.node-version
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.18.0

      - name: Publish native packages before launcher
        run: >-
          bash release-preflight/scripts/release-npm.sh
          "${{ needs.validate.outputs.version }}"
          "${{ needs.validate.outputs.dist_tag }}"
          release-preflight/preflight/npm-packages

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, crates-publish, npm-publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight
          path: release-preflight

      - name: Verify archive checksums
        working-directory: release-preflight/artifacts/release
        run: sha256sum --check SHA256SUMS

      - name: Create or recover GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          archives=(release-preflight/artifacts/release/*.tar.gz)
          checksums=release-preflight/artifacts/release/SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${archives[@]}" "$checksums" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --prerelease \
                --title "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$GITHUB_REF_NAME" \
                --prerelease=false \
                --latest \
                --title "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${archives[@]}" "$checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
